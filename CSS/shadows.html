<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            /* text-shadow:5px 2px 2px; */
            /* text-shadow:yellow 5px 5px 2px; */
            text-shadow:2px 5px ,2px 6px green,10px -5px red;  /* default colour = black*/
        }
        .container{
            background-color:beige;
            height:650px;
            border:2px solid black;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .box{
            background-color:aqua;
            width:430px;
            height:430px;
            border:1px solid brown;
            margin:5px;
            padding:5px;
            /* box-shadow:-20px 20px 5px*/ 
            box-shadow:-12px 5px;

        }
        img
        {
            height:200px;
            width:200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="logo.png" alt="">
            <h2>welcome to here</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Inventore dignissimos, eligendi quae adipisci soluta voluptate dolore labore? Inventore quae, ad mollitia natus id sapiente a.</p>
        </div>
    </div>
</body>
</html>
