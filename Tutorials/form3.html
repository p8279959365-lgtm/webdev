<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Complex Form</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name</label>
        <input type="text" id="name"><br/><br/>
        <label for="email">Email</label>
        <input type="text" id="email"><br/><br/>
        <label for="phonenumber">Phone</label>
        <input type="text" id="phonenumber"><br/><br/>
        <label for="date of birth">Date of Birth</label>
        <input type="date" id="date of birth"><br/><br/>
        <label for="gender">Gender</label>
        <label for="male">Male</label>
        <input type="radio" id="male">
        <label for="female">Female</label>
        <input type="radio" id="female"><br/><br/>
        <label for="country">Country</label>
        <select name="country" id="country">
            <option value="">Russia</option>
            <option value="">United States Of America</option>
            <option value="">India</option>
            <option value="">Britane</option>
        </select>
    </fieldset>
    <fieldset>
        <legend>Address</legend>
        <label for="street">Street</label>
        <input type="text" id="street"><br/><br/>
        <label for="city">City:</label>
        <input type="text" id="city"><br/><br/>
        <label for="state">State</label>
        <input type="text" id="state"><br/><br/>
        <label for="zip code">Zip Code</label>
        <input type="text" id="zip code">
    </fieldset>
    <fieldset>
        <legend>Other Information</legend>
        <label for="comments">Comments:</label><br/><br/>
        <textarea name="comment" id="comments" rows="10" columns="10"></textarea>
        <label for="t&c">I agree to the terms and services:</label>
        <input type="checkbox" id="t&c">
    </fieldset>
    <br/><br/>
    <button>submit</button>
</body>
</html>
