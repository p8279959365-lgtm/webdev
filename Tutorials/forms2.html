<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application</h1>
    <label for="name">Name:</label><br/>
    <input type="text" id="name"><br/>
    <label for="email">Email:</label><br/>
    <input type="text" id="email"><br/>
    <label for="phone">Phone</label><br/>
    <input type="number" id="phone"><br/>

    <label for="resume">Resume:</label><br/>
    <input type="file" id="resume"><br/>
    <label for="experience">Experience(years):</label><br/>
    <input type="number" id="experience">

    <fieldset>

        <legend>Skills</legend>
        <input type="checkbox" id="html"><br/>
        <label for="html">HTML</label><br/>
        <input type="checkbox" id="css"><br/>
        <label for="css">CSS</label><br/>
        <input type="checkbox" id="javascript"><br/>
        <label for="javascript">JavaScript</label><br/>
        <input type="checkbox" id="java"><br/>
        <label for="java">Java</label><br/>
        <input type="checkbox" id="c"><br/> 
        <label for="c">C</label><br/>
        <input type="checkbox" id="python"><br/>
        <label for="python">Python</label>    

    </fieldset>
    <label for="education">Highest Education:</label><br/>
    <select name="highschool" id="education">
        <option value="10th">10th</option>
        <option value="12th">12th</option>
        <option value="under graduate">Under Graduate</option>
        <option value="post graduate">Post Graduate</option>
        <option value="phd">P.hd</option>
    </select>
    <br/>

    <label for="availability">Availability:</label><br/>
    <input type="radio" id="full time"><br/>
    <label for="Full time">Full-time</label><br/>
    <input type="radio" id="part time"><br/>
    <label for="part time">Part-time</label><br/>

    <label for="additional comments">Additional Comments:</label><br/>
    <textarea name="additional comments" id="additional comments"></textarea>
    <input type="button" value="Submit Application">
    

</body>
</html>
