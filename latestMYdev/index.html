
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPERLUV | Electronic Press Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">HYPR <span>LUV</span></div>

        <div class="header-right">
            <div class="page-number">01 <span>/ 09</span></div>
            <button class="menu-btn" id="menuBtn">MENU +</button>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress"></div>
    </div>

    <!-- Main Hero Section -->
    <main class="hero">

        <section class="hero-content">

            <p class="eyebrow">ELECTRONIC PRESS KIT · 2026</p>

            <h1>HYPR<span>LUV</span></h1>

            <p class="description">
                Maximum volume hyperpop. Glossy chaos for people
                who treat the volume knob as a suggestion.
            </p>

            <div class="hero-buttons">
                <button class="primary-btn">HEAR THE MUSIC</button>
                <button class="secondary-btn">BOOKING</button>
            </div>

        </section>

        <!-- Right Side -->
        <aside class="hero-side">

            <div class="side-buttons">
                <button class="orange-btn">NEW BOOKING</button>
                <button class="green-btn">NEW ALBUM</button>
            </div>

            <div class="star">✦</div>

            <p class="artist-code">EPK / TM-627</p>

        </aside>

    </main>

    <!-- Bottom Marquee -->
    <div class="marquee">
        <div class="marquee-content">
            NEW ALBUM "MAXIMUM VOLUME" OUT NOW
            ✦
            2.4M MONTHLY LISTENERS
            ✦
            NEW ALBUM "MAXIMUM VOLUME" OUT NOW
            ✦
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
